<!DOCTYPE html>
<html>

<head>
    <title>Membuat Form</title>
</head>

<body>
    <form action="proses.php" method="get">
        <table border="0">
            <tr>
                <td> Nama Lengkap</td>
                <td>: <input type="text" name="namalengkap"></td>
            </tr>
            <tr>
                <td>password</td>
                <td>: <input type="Password" name="Password"></td>
            </tr>
            <tr>
                <td> Jenis Kelamin</td>
                <td>: <input type="Radio" name="Laki-laki">Laki-laki
                    <input type="Radio" name="Perempuan">Perempuan
                </td>
            </tr>
            <tr>
                <td>Hobi</td>
                <td>: <input type="chechbox" name="hobi_menggambar" /> Menggambar
                    <input type="chechbox" name="hobi_tidur" /> Tidur
                    <input type="chechbox" name="hobi_main-games" /> Main Games
                </td>
            </tr>
            <tr>
                <td>Asal kota</td>
                <td>: <select name="kota">
                        <option value="Jakarta">Jakarta</option>
                        <option value="Bandung" selected="selected">Bandung</option>
                        <option value="Subang" selected="selected">Subang</option>
                        <option value="Bekasi" selected="selected">Bekasi</option>
                        <option value="Surabaya">Surabaya</option>
                    </select></td>
            </tr>
            <tr>
                <td>Alamat Lengkap</td>
                <td> <textarea name="alamat_lengkap" rows="5" cols="20">
                        Silahkan Isi Alamat Lengkap
                    </textarea></td>
            </tr>
            <tr>
                <td><input type="submit" name="simpan" value="simpan"></td>
                <td><input type="reset" value="reset"></td>
            </tr>
        </table>
    </form>
</body>

</html>
